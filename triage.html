<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediKiosk — Emergency Triage & Red-Flag Station</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <script>
    lucide.createIcons();

    function getSharedQueue() {
      try {
        const q = localStorage.getItem("MEDIKIOSK_SHARED_QUEUE");
        return q ? JSON.parse(q) : [];
      } catch (e) {
        return [];
      }
    }

    function renderTriageQueue() {
      const queue = getSharedQueue();
      const container = document.getElementById("triage-cards-container");
      if (!container) return;

      const emergencyItems = queue.filter(item => item.isEmergency === true || (item.tokenNumber && item.tokenNumber.includes("E-")));
      
      const countBadge = document.querySelector("section span.animate-pulse");
      if (countBadge) {
        countBadge.innerText = `${emergencyItems.length} Critical Alert${emergencyItems.length !== 1 ? 's' : ''}`;
      }

      if (emergencyItems.length === 0) {
        container.innerHTML = `
          <div class="p-8 rounded-xl bg-emerald-50 border border-emerald-300 text-center space-y-2">
            <i data-lucide="shield-check" class="w-10 h-10 text-emerald-600 mx-auto"></i>
            <h3 class="font-bold text-emerald-900 text-base">All Kiosks Normal • No Active Red-Flags</h3>
            <p class="text-xs text-emerald-700">Sub-150ms interceptor is monitoring all hospital entrance points.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = emergencyItems.map((item, idx) => `
        <div class="p-5 rounded-xl bg-red-950/40 border-2 border-red-500 space-y-3 shadow-lg">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <span class="text-3xl font-black text-red-400">${item.tokenNumber || '#E-012'}</span>
              <div>
                <h3 class="font-bold text-white text-base">${item.patientName || 'EMERGENCY PATIENT'} (${item.age || 45}${item.gender === 'Male' ? 'M' : (item.gender === 'Female' ? 'F' : '')})</h3>
                <p class="text-xs text-slate-400">${item.location || 'Kiosk #1'} • Time: <span class="font-bold text-emerald-400">${item.timestamp || 'Just now'}</span></p>
              </div>
            </div>
            <span class="bg-red-600 text-white font-black text-xs px-3 py-1 rounded-full animate-pulse">PRIORITY 1 - STAT RED</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs pt-1">
            <div class="bg-black/30 p-2.5 rounded-lg border border-red-900/50">
              <span class="text-slate-400 block text-[10px] uppercase font-bold">Spoken Symptoms (Native Input)</span>
              <p class="font-semibold text-red-200 mt-0.5">${item.nativeSpeech || '"' + item.subjective + '"'}</p>
            </div>
            <div class="bg-black/30 p-2.5 rounded-lg border border-red-900/50">
              <span class="text-slate-400 block text-[10px] uppercase font-bold">AI Clinical Translation & Triage</span>
              <p class="font-semibold text-white mt-0.5">${item.englishTranslation || item.subjective}</p>
            </div>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-red-900/40">
            <div class="flex items-center space-x-2 text-xs">
              <span class="w-2 h-2 rounded-full bg-red-400 animate-ping"></span>
              <span class="text-red-300 font-bold">Auto-Notified: ER Duty Resuscitation Bay 1</span>
            </div>
            <div class="flex space-x-2">
              <button onclick="dispatchCrashCart('${item.tokenNumber}')" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-4 py-2 rounded-lg transition flex items-center gap-1.5 shadow-lg">
                <i data-lucide="bell-ring" class="w-3.5 h-3.5"></i> Dispatch Crash Cart
              </button>
              <button onclick="routeToBed('${item.tokenNumber}')" class="bg-white/10 hover:bg-white/20 text-[#D9CDBA] font-bold text-xs px-3 py-2 rounded-lg border border-[#D9CDBA]/30 transition">
                Route to Bed 1
              </button>
            </div>
          </div>
        </div>
      `).join("");

      lucide.createIcons();
    }

    function dispatchCrashCart(token) {
      showNotif("🚨 Crash Cart Dispatched!", `Emergency Response Team & Nurse En-Route to ${token || 'Kiosk'}.`);
    }

    function routeToBed(token) {
      showNotif("🏥 Route Assigned", `Patient ${token || ''} routed to Emergency Resuscitation Bed 1.`);
    }

    function showNotif(title, desc) {
      document.getElementById("triage-msg-title").innerText = title;
      document.getElementById("triage-msg-desc").innerText = desc;
      const n = document.getElementById("triage-notif");
      n.classList.remove("hidden");
      setTimeout(() => n.classList.add("hidden"), 4000);
      lucide.createIcons();
    }

    // Auto-sync with Kiosk in real-time
    window.addEventListener("storage", function(e) {
      if (e.key === "MEDIKIOSK_SHARED_QUEUE") {
        renderTriageQueue();
      }
    });

    document.addEventListener("DOMContentLoaded", renderTriageQueue);
  </script>
</body>
</html>
